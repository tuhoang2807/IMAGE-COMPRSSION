<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ảnh mới</title>
    
    <!-- Bootstrap & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/upload.css">
</head>
<body class="bg-light">
    
    <!-- Sidebar -->
    <div class="sidebar">
        <a href="#"><i class="bi bi-images text-danger fs-2"></i></a>
        <a href="./index.html"><i class="bi bi-house-door"></i></a>
        <a href="./upload.html"><i class="bi bi-plus-circle"></i></a>
        <a href="./profile.html"><i class="bi bi-person"></i></a>
        <a href="#" onclick="toggleSidebar()"><i class="bi bi-gear"></i></a>
    </div>

    <!-- Overlay che toàn trang -->
    <div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar cài đặt -->
    <div id="settingsSidebar" class="settings-sidebar">
        <button class="close-btn btn btn-light" onclick="toggleSidebar()">✖</button>
        <a href="register.html" class="btn btn-danger w-100 mt-3">Đăng xuất</a>
    </div>

    <!-- Main Content -->
    <div class="container mt-5" style="margin-left: 90px;">
        <h2 class="text-center text-danger">
            <i class="fas fa-upload"></i> Đăng ảnh mới
        </h2>
        <div class="card shadow p-4">
            <form id="uploadForm" enctype="multipart/form-data">
                
                <!-- Khu vực Drag & Drop -->
                <div class="mb-3 text-center">
                    <label for="file-input" class="drop-area rounded">
                        <i class="fas fa-cloud-upload-alt fa-3x"></i><br>
                        <span>Kéo & thả ảnh vào đây hoặc nhấp để chọn</span>
                        <input type="file" name="image" id="file-input" hidden>
                    </label>
                    <div id="preview-container" class="mt-3"></div> <!-- Khu vực hiển thị ảnh đã chọn -->
                </div>

                <!-- Tiêu đề -->
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-heading"></i> Tiêu đề:</label>
                    <input type="text" name="title" class="form-control" required>
                </div>

                <!-- Mô tả -->
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-align-left"></i> Mô tả:</label>
                    <textarea name="description" class="form-control"></textarea>
                </div>

                <!-- Nút tải lên -->
                <button type="submit" class="btn btn-danger w-100">
                    <i class="fas fa-paper-plane"></i> Tải lên
                </button>
            </form>
        </div>
    </div>

    <script>
        const userData = localStorage.getItem("userData");
        if (!userData) {
            window.location.href = "/login.html";
        }

        document.querySelector('#file-input').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('preview-container').innerHTML = `<img src="${e.target.result}" class="img-fluid rounded" style="max-width: 100%; height: auto;">`;
                };
                reader.readAsDataURL(file);
            }
        });

        document.querySelector('#uploadForm').addEventListener('submit', async function(event) {
            event.preventDefault(); // Ngừng gửi form mặc định

            // Lấy thông tin từ localStorage
            const userObject = JSON.parse(userData);
            const token = userObject.token;
            const userId = userObject.user.id;

            // Lấy thông tin từ form
            const title = document.querySelector('input[name="title"]').value;
            const description = document.querySelector('textarea[name="description"]').value;
            const fileInput = document.querySelector('input[name="image"]');
            const file = fileInput.files[0];

            if (!file) {
                alert("Vui lòng chọn một tệp ảnh.");
                return;
            }

            // Tạo FormData
            const formData = new FormData();
            formData.append('image', file);
            formData.append('title', title);
            formData.append('description', description);
            formData.append('userId', userId); // Gửi userId cùng với dữ liệu

            try {
                const response = await fetch("http://localhost:5000/api/images/upload", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${token}`, // Gửi token trong header
                    },
                    body: formData
                });

                const result = await response.json();
                if (response.ok) {
                    alert("Ảnh đã được tải lên thành công!");
                } else {
                    alert(result.message || "Có lỗi xảy ra trong quá trình tải lên.");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Đã xảy ra lỗi khi tải ảnh lên.");
            }
        });

        function toggleSidebar() {
            const sidebar = document.getElementById("settingsSidebar");
            const overlay = document.getElementById("overlay");

            if (sidebar.style.right === "0px") {
                sidebar.style.right = "-250px";
                overlay.style.display = "none";
            } else {
                sidebar.style.right = "0px";
                overlay.style.display = "block";
            }
        }
    </script>

</body>
</html>
