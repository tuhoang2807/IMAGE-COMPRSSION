<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>

    <!-- Bootstrap & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Link đến file CSS -->
    <link rel="stylesheet" href="./css/register.css">
</head>
<body>
<div class="card shadow p-4 rounded-3">
    <h4 class="text-center">Đăng nhập</h4>

    <form id="login-form">
        <div class="mb-3">
            <label class="form-label">Tên đăng nhập</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-user"></i></span>
                <input type="text" id="username" class="form-control" placeholder="Nhập tên đăng nhập" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Mật khẩu</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu" required>
            </div>
        </div>

        <button type="button" class="btn btn-success w-100" onclick="checkLogin()">Đăng nhập</button>
        <p class="text-danger mt-2 text-center" id="error-message" style="display: none;">Sai tài khoản hoặc mật khẩu!</p>

        <div class="text-center mt-3">
            <p>Chưa có tài khoản? <a href="register.html" class="text-primary">Đăng ký ngay</a></p>
        </div>
    </form>
</div>

<!-- Bootstrap & JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    async function checkLogin() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const errorMessage = document.getElementById("error-message");

        try {
            const response = await fetch("http://localhost:5000/api/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ username, password }),
                credentials: "include"
            });

            const data = await response.json();

            if (response.ok) {
                alert("Đăng nhập thành công!");
                
                // Lưu toàn bộ dữ liệu vào localStorage
                localStorage.setItem("userData", JSON.stringify(data));

                // Nếu có token, lưu vào localStorage
                if (data.token) {
                    localStorage.setItem("authToken", data.token);
                }

                // Chuyển hướng sau khi đăng nhập
                window.location.href = "index.html";
            } else {
                errorMessage.textContent = data.message || "Đăng nhập thất bại!";
                errorMessage.style.display = "block";
            }
        } catch (error) {
            console.error("Lỗi đăng nhập:", error);
            errorMessage.textContent = "Lỗi máy chủ. Vui lòng thử lại!";
            errorMessage.style.display = "block";
        }
    }
</script>

</body>
</html>
